<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gonçalves Câmbio | Painel</title>

  <link rel="stylesheet" href="painel.css">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <div class="login-container">

    <div class="login-box">

      <div class="logo">
        💱
      </div>

      <h1>Gonçalves Câmbio</h1>

      <p class="subtitle">
        Painel Administrativo
      </p>

      <form id="loginForm">

        <label for="email">
          E-mail
        </label>

        <input
          type="email"
          id="email"
          placeholder="Digite seu e-mail"
          required
          autocomplete="email"
        >

        <label for="password">
          Senha
        </label>

        <div class="password-box">

          <input
            type="password"
            id="password"
            placeholder="Digite sua senha"
            required
            autocomplete="current-password"
          >

          <button
            type="button"
            id="mostrarSenha"
            class="show-password"
          >
            👁️
          </button>

        </div>

        <button
          type="submit"
          id="loginBtn"
          class="login-btn"
        >
          Entrar no painel
        </button>

        <div
          id="loginMessage"
          class="login-message"
        ></div>

      </form>

    </div>

  </div>

  <script src="painel.js"></script>

</body>
</html>
