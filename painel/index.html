<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gonçalves Câmbio | Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        radial-gradient(circle at top right, #14532d, transparent 35%),
        linear-gradient(135deg, #020617, #07111f);
    }

    .login {
      width: 100%;
      max-width: 420px;
      padding: 38px;
      border-radius: 24px;
      background: rgba(15, 23, 42, .94);
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 30px 80px rgba(0,0,0,.5);
      color: white;
    }

    .logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 20px;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg,#22c55e,#15803d);
      font-size: 36px;
      box-shadow: 0 15px 35px rgba(34,197,94,.25);
    }

    h1 {
      text-align: center;
      font-size: 27px;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      margin: 8px 0 30px;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      color: #cbd5e1;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      width: 100%;
      height: 52px;
      padding: 0 15px;
      border-radius: 11px;
      border: 1px solid #334155;
      background: #020617;
      color: white;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #22c55e;
    }

    #loginBtn {
      width: 100%;
      height: 52px;
      margin-top: 24px;
      border: 0;
      border-radius: 11px;
      background: #16a34a;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #loginBtn:hover {
      background: #15803d;
    }

    #loginMessage {
      min-height: 24px;
      margin-top: 15px;
      text-align: center;
      color: #f87171;
      font-size: 14px;
    }

    .security {
      margin-top: 25px;
      padding: 13px;
      border-radius: 11px;
      background: rgba(34,197,94,.08);
      color: #86efac;
      text-align: center;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <main class="login">

    <div class="logo">💱</div>

    <h1>Gonçalves Câmbio</h1>

    <p class="subtitle">
      Painel Administrativo
    </p>

    <form id="loginForm">

      <label for="email">
        E-mail
      </label>

      <input
        id="email"
        type="email"
        placeholder="Digite seu e-mail"
        autocomplete="username"
        required
      >

      <label for="password">
        Senha
      </label>

      <input
        id="password"
        type="password"
        placeholder="Digite sua senha"
        autocomplete="current-password"
        required
      >

      <button id="loginBtn" type="submit">
        Entrar no painel
      </button>

      <div id="loginMessage"></div>

    </form>

    <div class="security">
      🛡️ Acesso protegido pelo Supabase Auth
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://skfodedzzdeptnksufuq.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_TDC6NwdHx1XuYhXcFzxkiQ_1N6lLkGE";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );

    async function verificarSessao() {

      const { data } =
        await supabaseClient.auth.getSession();

      if (data && data.session) {
        window.location.href = "dashboard.html";
      }

    }

    verificarSessao();

    document
      .getElementById("loginForm")
      .addEventListener("submit", async function(event) {

        event.preventDefault();

        const email =
          document.getElementById("email").value.trim();

        const password =
          document.getElementById("password").value;

        const btn =
          document.getElementById("loginBtn");

        const message =
          document.getElementById("loginMessage");

        btn.disabled = true;
        btn.textContent = "Entrando...";
        message.textContent = "";

        const { error } =
          await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });

        if (error) {

          message.textContent =
            "❌ E-mail ou senha incorretos.";

          btn.disabled = false;
          btn.textContent = "Entrar no painel";

          return;
        }

        message.style.color = "#4ade80";
        message.textContent =
          "✅ Login realizado. Entrando...";

        setTimeout(function() {
          window.location.href = "dashboard.html";
        }, 500);

      });
  </script>

</body>
</html>
