<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Gonçalves Câmbio | Painel Administrativo</title>

  <meta
    name="description"
    content="Painel administrativo do Gonçalves Câmbio"
  >

  <link
    rel="stylesheet"
    href="painel.css"
  >

  <!-- SUPABASE -->
  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

</head>


<body>

  <main class="login-container">

    <section
      class="login-box"
      aria-label="Login administrativo"
    >

      <!-- LOGO -->

      <div
        class="logo"
        aria-hidden="true"
      >
        💱
      </div>


      <!-- TÍTULO -->

      <h1>
        Gonçalves Câmbio
      </h1>


      <p class="subtitle">
        Painel Administrativo
      </p>


      <!-- LOGIN -->

      <form
        id="loginForm"
        autocomplete="on"
      >

        <!-- E-MAIL -->

        <label for="email">
          E-mail
        </label>

        <input
          type="email"
          id="email"
          name="email"
          placeholder="Digite seu e-mail"
          required
          autocomplete="email"
        >


        <!-- SENHA -->

        <label for="password">
          Senha
        </label>


        <div class="password-box">

          <input
            type="password"
            id="password"
            name="password"
            placeholder="Digite sua senha"
            required
            autocomplete="current-password"
          >


          <button
            type="button"
            id="mostrarSenha"
            class="show-password"
            aria-label="Mostrar ou ocultar senha"
          >
            👁️
          </button>

        </div>


        <!-- BOTÃO -->

        <button
          type="submit"
          id="loginBtn"
          class="login-btn"
        >
          Entrar no painel
        </button>


        <!-- MENSAGEM -->

        <div
          id="loginMessage"
          class="login-message"
          role="alert"
          aria-live="polite"
        ></div>

      </form>

    </section>

  </main>


  <!-- SEU JAVASCRIPT -->

  <script src="painel.js"></script>

</body>

</html>
